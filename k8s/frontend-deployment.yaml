apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/aref-hammaslak/lams/frontend:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: API_URL
              value: "http://backend:80"
            - name: APP_PORT
              value: "8080"
          resources:
            limits:
              memory: 200Mi
              cpu: 0.1
            requests:
              memory: 200Mi
              cpu: 0.1
      imagePullSecrets:
        - name: regcred