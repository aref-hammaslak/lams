name: CI/CD

on:
  push:
    branches: [ master ]
    paths-ignore:
      - ".github/workflows/**"
      - "*.txt"
      - "*.md"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency: staging

env:
  PROJ_NAME: lams-x-front
  DOCKER_IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/lams-x-front:latest

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lams-x-front:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: /tmp/${{ github.sha }}.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy Compose file to server
        uses: garygrossgarten/github-action-scp@v0.8.0
        with:
          local: docker-compose.yml
          remote: ${{ env.COMPOSE_FILE }}
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          privateKey: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy app
        uses: appleboy/ssh-action@v1.0.0
        env:
          LAMS_FRONT_PORT: "8091"
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKER_IMAGE_TAG,LAMS_FRONT_PORT
          script_stop: true
          script: |
            docker login ghcr.io -u "${{ github.repository_owner }}" -p "${{ secrets.GITHUB_TOKEN }}"

            docker compose -p ${{ env.PROJ_NAME }} -f "${{ env.COMPOSE_FILE }}" pull
            docker compose -p ${{ env.PROJ_NAME }} -f "${{ env.COMPOSE_FILE }}" up -d --remove-orphans

            rm "${{ env.COMPOSE_FILE }}"