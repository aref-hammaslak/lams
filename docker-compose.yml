version: '3.8'

services:
  db:
    image: lams-db
    restart: always
    networks:
      - lams-net
    volumes:
      - db-data:/data/db
      - db-cfg:/data/configdb

  api:
    image: lams-api
    depends_on:
      - db
    restart: always
    networks:
      - lams-net
   
    environment:
      - LAMS_PORT=8080 
      - LAMS_DB_URI=mongodb://db:27017/LaMsDB
      # - LAMS_SESSION_SECRET:
    volumes:
      - upload-data:/app/public/uploads
  
  client:
    image: lams-client
    depends_on:
      - api
    environment:
      - API_URL=http://api:8080
      - APP_PORT=80
    networks:
      - lams-net
    ports:
      - "80:80"
    

networks:
  lams-net:
    name: lams-net
    driver: bridge

volumes:
  db-data:
  db-cfg:
  upload-data: